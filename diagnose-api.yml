name: Diagnose NGM API (one-off, manual only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-full-list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run diagnostic
        run: npm run inspect-api
