name: Scrape full Vontobel list (daily 17:30 CET)

on:
  schedule:
    # GitHub Actions cron is UTC only, and has no DST awareness.
    # 17:30 CET (winter, UTC+1)  = 16:30 UTC
    # 17:30 CEST (summer, UTC+2) = 15:30 UTC
    # Both are scheduled below; each run checks the current CET/CEST wall
    # clock and exits immediately if it isn't actually 17:30 there, so only
    # one of the two actually scrapes on any given day.
    - cron: "30 16 * 1,2,3,11,12 *"   # CET months (roughly)
    - cron: "30 15 * 4,5,6,7,8,9,10 *" # CEST months (roughly)
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-full-list
    steps:
      - uses: actions/checkout@v4

      - name: Check it's actually ~17:30 Europe/Stockholm
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manually triggered (workflow_dispatch) — skipping the time gate, running now."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Stockholm date +%H)
          echo "Local Stockholm time hour: $hour"
          if [ "$hour" == "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 17:xx in Stockholm — skipping (the other cron line covers this half of the year)."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: npm install

      - name: Run scraper
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape
